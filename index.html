
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202c33">
<title>somchat</title>
<style>
:root{--bg:#0b141a;--bar:#202c33;--mine:#005c4b;--theirs:#202c33;--text:#e9edef;--dim:#8696a0;--accent:#00a884;--err:#f28b82}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
#auth form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#auth h1{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
#auth p.sub{color:var(--dim);margin-bottom:8px}
input{background:var(--bar);border:1px solid transparent;border-radius:10px;padding:13px 14px;width:100%}
input::placeholder{color:var(--dim)}
.btn{background:var(--accent);color:#06130f;border:0;border-radius:10px;padding:13px;font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:8px}
#err{color:var(--err);min-height:1.4em;font-size:.9rem}
#chat{height:100%;display:flex;flex-direction:column}
header{background:var(--bar);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#06130f;display:grid;place-items:center;font-weight:700}
header .t{flex:1;min-width:0}
header .t b{display:block}
header .t span{color:var(--dim);font-size:.8rem}
#out{background:none;border:0;color:var(--dim);cursor:pointer;padding:8px}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
.row{display:flex}
.row.me{justify-content:flex-end}
.msg{max-width:80%;padding:6px 9px 5px;border-radius:9px;background:var(--theirs);overflow-wrap:anywhere}
.me .msg{background:var(--mine)}
.who{display:block;color:var(--accent);font-size:.8rem;font-weight:600}
.txt{white-space:pre-wrap}
.time{display:block;text-align:right;color:var(--dim);font-size:.68rem;margin-top:1px}
.empty{margin:auto;color:var(--dim);text-align:center;padding:24px}
form#send{display:flex;gap:8px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar)}
form#send input{background:#2a3942;border-radius:22px;padding:11px 16px}
#go{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#06130f;cursor:pointer;display:grid;place-items:center}
#go svg{width:22px;height:22px}
</style>
</head>
<body>

<div id="auth" class="hidden">
  <form id="authForm">
    <h1>somchat</h1>
    <p class="sub" id="sub">Sign in to start chatting.</p>
    <input id="name" class="hidden" placeholder="Your name" autocomplete="nickname" maxlength="30">
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" required>
    <div id="err" role="alert"></div>
    <button class="btn" id="submit" type="submit">Sign in</button>
    <button class="link" id="toggle" type="button">New here? Create an account</button>
  </form>
</div>

<div id="chat" class="hidden">
  <header>
    <div class="avatar">S</div>
    <div class="t"><b>Everyone</b><span id="me"></span></div>
    <button id="out" type="button">Sign out</button>
  </header>
  <div id="list" aria-live="polite"></div>
  <form id="send" autocomplete="off">
    <input id="text" placeholder="Message" maxlength="1000" aria-label="Message">
    <button id="go" type="submit" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_dU-ViMR6LwvFQDmJ8I835azc7-TLD6M",
  authDomain: "somchat-3fde6.firebaseapp.com",
  projectId: "somchat-3fde6",
  storageBucket: "somchat-3fde6.firebasestorage.app",
  messagingSenderId: "909663365730",
  appId: "1:909663365730:web:b201e656ac11b8619f7f3b",
  measurementId: "G-C6ZS2TXHFY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let signup = false, stopMessages = null;

function setMode(isSignup){
  signup = isSignup;
  $("name").classList.toggle("hidden", !signup);
  $("name").required = signup;
  $("submit").textContent = signup ? "Create account" : "Sign in";
  $("toggle").textContent = signup ? "Already have an account? Sign in" : "New here? Create an account";
  $("sub").textContent = signup ? "Pick a name so people know who you are." : "Sign in to start chatting.";
  $("pass").autocomplete = signup ? "new-password" : "current-password";
  $("err").textContent = "";
}
$("toggle").onclick = () => setMode(!signup);

const errors = {
  "auth/email-already-in-use": "That email already has an account. Sign in instead.",
  "auth/invalid-email": "That email address doesn’t look right.",
  "auth/weak-password": "Password needs at least 6 characters.",
  "auth/invalid-credential": "Wrong email or password.",
  "auth/user-not-found": "No account with that email. Create one first.",
  "auth/wrong-password": "Wrong email or password.",
  "auth/operation-not-allowed": "Email/Password sign-in isn’t turned on in Firebase yet.",
  "auth/network-request-failed": "No connection. Check your internet and try again."
};

$("authForm").onsubmit = async e => {
  e.preventDefault();
  $("err").textContent = "";
  $("submit").disabled = true;
  try {
    const email = $("email").value.trim(), pass = $("pass").value;
    if (signup) {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: $("name").value.trim() });
      showChat(cred.user);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (err) {
    $("err").textContent = errors[err.code] || "Something went wrong. Try again.";
  }
  $("submit").disabled = false;
};

$("out").onclick = () => signOut(auth);

function showChat(user){
  const name = user.displayName || user.email.split("@")[0];
  $("me").textContent = "Signed in as " + name;
  $("auth").classList.add("hidden");
  $("chat").classList.remove("hidden");
  if (stopMessages) stopMessages();
  const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(100));
  stopMessages = onSnapshot(q, snap => {
    const list = $("list");
    const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
    list.replaceChildren();
    if (snap.empty) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "No messages yet. Say hello!";
      list.append(d);
      return;
    }
    snap.docs.reverse().forEach(doc => {
      const m = doc.data();
      const row = document.createElement("div");
      row.className = "row" + (m.uid === user.uid ? " me" : "");
      const box = document.createElement("div");
      box.className = "msg";
      if (m.uid !== user.uid) {
        const w = document.createElement("span");
        w.className = "who"; w.textContent = m.name || "Someone";
        box.append(w);
      }
      const t = document.createElement("span");
      t.className = "txt"; t.textContent = m.text;
      const tm = document.createElement("span");
      tm.className = "time";
      const when = m.createdAt ? m.createdAt.toDate() : new Date();
      tm.textContent = when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      box.append(t, tm);
      row.append(box);
      list.append(row);
    });
    if (nearBottom || list.dataset.first !== "1") { list.scrollTop = list.scrollHeight; list.dataset.first = "1"; }
  }, () => {
    $("list").innerHTML = "";
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "Can’t load messages. Check that Firestore is created and its rules allow signed-in users.";
    $("list").append(d);
  });
}

$("send").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  const user = auth.currentUser;
  if (!text || !user) return;
  $("text").value = "";
  try {
    await addDoc(collection(db, "messages"), {
      text, uid: user.uid,
      name: user.displayName || user.email.split("@")[0],
      createdAt: serverTimestamp()
    });
  } catch (err) {
    $("text").value = text;
  }
};

onAuthStateChanged(auth, user => {
  if (user) {
    showChat(user);
  } else {
    if (stopMessages) { stopMessages(); stopMessages = null; }
    $("chat").classList.add("hidden");
    $("auth").classList.remove("hidden");
    $("list").dataset.first = "";
  }
});
</script>
</body>
  </html>
